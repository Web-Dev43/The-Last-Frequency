<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="The Last Frequency — a cinematic 3D horror mystery.">
  <title>The Last Frequency</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <main id="film">
    <canvas id="renderCanvas" aria-label="The Last Frequency cinematic scene"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <section id="intro" class="overlay">
      <p class="eyebrow">A CINEMATIC 3D EXPERIENCE</p>
      <h1>THE LAST<br><span>FREQUENCY</span></h1>
      <p class="tagline">Some things never stop calling.</p>
      <button id="beginButton" type="button">BEGIN FILM</button>
      <p class="hint">Headphones recommended · Sound can be enabled on start</p>
    </section>
    <div id="chapter" class="chapter" aria-live="polite"></div>
    <div id="subtitles" class="subtitles" aria-live="polite"></div>
    <button id="soundButton" class="sound-button" type="button" aria-label="Toggle sound">SOUND OFF</button>
    <div id="endCard" class="overlay end-card" hidden>
      <p class="eyebrow">THE STORY CONTINUES</p>
      <h2>THE LAST FREQUENCY</h2>
      <p>Chapter One · The Signal</p>
      <button id="replayButton" type="button">REPLAY</button>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
